[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikillm-paper-digest"
version = "2.3.0"
description = "Research paper digest for WikiLLM without an LLM: CLI, local web app, and MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "WikiLLM Paper Digest contributors" }]
keywords = [
  "wikillm",
  "research-paper",
  "pdf-to-markdown",
  "no-llm",
  "mcp",
  "firecrawl",
  "ocr",
  "bm25",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pydantic>=2.8,<3",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
paper-digest = "paper_digest.cli:main"
paper-digest-web = "paper_digest.web_cli:main"
paper-digest-mcp = "paper_digest.mcp_server:main"

[project.urls]
Homepage = "https://github.com/wmyung/wikillm-digest-noLLM"
Documentation = "https://github.com/wmyung/wikillm-digest-noLLM#readme"
Source = "https://github.com/wmyung/wikillm-digest-noLLM"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
